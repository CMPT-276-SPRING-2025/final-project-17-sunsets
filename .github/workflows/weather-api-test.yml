name: Weather API Test

on: [push, pull_request]

jobs:
  test-weather-api:
    runs-on: ubuntu-latest
    env:
      REACT_APP_WEATHER_API_KEY: ${{ secrets.REACT_APP_WEATHER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: ./code

      - name: Run Weather API Test
        run: |
          node --input-type=module -e "
            const { getWeather } = await import('./src/getWeather.js');
            process.env.REACT_APP_WEATHER_API_KEY = '${{ secrets.REACT_APP_WEATHER_API_KEY }}';
            const cities = ['New York', 'Tokyo', 'Paris', 'Cairo'];
            const results = await Promise.all(cities.map(getWeather));
            results.forEach((res, i) => {
              if (!res || !res.condition || !res.temperature) {
                throw new Error('❌ Missing weather data for ' + cities[i]);
              }
            });
            console.log('✅ Weather API returned valid results for all cities.');
          "
        working-directory: ./code
