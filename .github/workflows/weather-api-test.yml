name: Weather API Test

on: [push, pull_request]

jobs:
  test-weather-api:
    runs-on: ubuntu-latest
    env:
      REACT_APP_WEATHER_API_KEY: ${{ secrets.REACT_APP_WEATHER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: ./code

      - name: Run Weather API Test
        run: |
          node -e "
            const getWeather = require('./src/getWeather');
            const cities = ['New York', 'Tokyo', 'Paris', 'Cairo'];
            process.env.REACT_APP_WEATHER_API_KEY = '${{ secrets.REACT_APP_WEATHER_API_KEY }}';
            Promise.all(cities.map(city => getWeather(city)))
              .then(results => {
                results.forEach((res, idx) => {
                  if (!res || !res.weather) throw new Error('No weather data for ' + cities[idx]);
                });
                console.log('✅ Weather API passed for all cities');
              })
              .catch(err => {
                console.error(err);
                process.exit(1);
              });
          "
        working-directory: ./code
