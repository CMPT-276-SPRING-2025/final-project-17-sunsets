name: Wger API Test

on: [push, pull_request]

jobs:
  test-wger-api:
    runs-on: ubuntu-latest
    env:
      REACT_APP_WGER_API_KEY: ${{ secrets.REACT_APP_WGER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: ./code

      - name: Run Wger API Test
        run: |
          node --input-type=module -e "
            const { getWorkouts } = await import('./src/getWorkouts.js');
            process.env.REACT_APP_WGER_API_KEY = '${{ secrets.REACT_APP_WGER_API_KEY }}';
            const workouts = await getWorkouts();
            if (!Array.isArray(workouts) || workouts.length === 0) {
              throw new Error('❌ No workouts returned from Wger API');
            }
            console.log('✅ Wger API returned', workouts.length, 'workouts');
          "
        working-directory: ./code
